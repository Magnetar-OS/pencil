[package]
name = "pencil"
version = "1.0.0"
edition = "2024"
# GPL-3.0-only applies to THIS package — the Pencil application. The Nib
# engine it is built on is MPL-2.0 and is linked, not absorbed.
license = "GPL-3.0-only"
description = "Pencil — a rich text editor for the COSMIC desktop"
repository = "https://github.com/Magnetar-OS/pencil"
rust-version = "1.98.1"

[dependencies]
# --- the Nib engine (MPL-2.0), from its own repository ---
# The engine is deliberately several crates: the model has no toolkit, the
# serialisers have no view, and an application takes the ones it uses.
#
# All from git, at a tag, rather than from crates.io — even the six that are
# published there. The widget cannot be published at all, because it depends on
# libcosmic and libcosmic is not on crates.io; and a build that took the widget
# from git and the model from the registry would have two `cosmic-ext-nib-model`
# crates from two sources, whose `Node` types are not the same type. One source
# or the other, and the widget decides which.
nib = { git = "https://github.com/Magnetar-OS/cosmic-ext-nib.git", tag = "v1.1.0", package = "cosmic-ext-nib" }
nib-model = { git = "https://github.com/Magnetar-OS/cosmic-ext-nib.git", tag = "v1.1.0", package = "cosmic-ext-nib-model" }
nib-html = { git = "https://github.com/Magnetar-OS/cosmic-ext-nib.git", tag = "v1.1.0", package = "cosmic-ext-nib-html" }
nib-markdown = { git = "https://github.com/Magnetar-OS/cosmic-ext-nib.git", tag = "v1.1.0", package = "cosmic-ext-nib-markdown" }
nib-text = { git = "https://github.com/Magnetar-OS/cosmic-ext-nib.git", tag = "v1.1.0", package = "cosmic-ext-nib-text" }
nib-highlight = { git = "https://github.com/Magnetar-OS/cosmic-ext-nib.git", tag = "v1.1.0", package = "cosmic-ext-nib-highlight" }
nib-spell = { git = "https://github.com/Magnetar-OS/cosmic-ext-nib.git", tag = "v1.1.0", package = "cosmic-ext-nib-spell" }

i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.12"
open = "5.4"
thiserror = "2"
tokio = { version = "1.53", features = ["fs", "rt"] }
pdf-writer = "0.15.0"
swash = "0.2"
ashpd = "0.12"
flate2 = "1.1.10"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = ["about", "single-instance", "wgpu", "xdg-portal", "tokio"]

[lib]
name = "pencil"
path = "src/lib.rs"

[[bin]]
name = "pencil"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1.53", features = ["fs", "macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
