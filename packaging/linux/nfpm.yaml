# nfpm config for the .deb, .rpm and Arch .pkg.tar.zst — consumed by
# linux-release-kit's release.yml. The file layout is NOT declared here:
# the workflow's build_command stages it with the justfile's own
# `just rootdir=... install`, and the single tree entry below packages
# whatever the justfile installed. One source of truth for the layout.
#
# The RK_* variables are exported by the release workflow; nfpm expands
# ${VAR} itself. You never edit the version here.

# Not `pencil`: other repositories ship an unrelated `pencil` (Evolus Pencil,
# the prototyping tool, 3.x) under that name, with /usr/bin/pencil. Sharing the
# name meant whichever repository pacman read first decided which program
# `pacman -S pencil` installed, and the two could not be installed together.
name: magnetar-pencil
arch: ${RK_DEB_ARCH}
platform: linux
version: ${RK_VERSION}
release: "1"
section: utils
priority: optional
maintainer: Dominikos Pritis <dominikos.pritis@gmail.com>
vendor: entro314-labs
homepage: https://github.com/Magnetar-OS/pencil
license: GPL-3.0-only
description: |
  A rich text editor for the COSMIC desktop

# Runtime dependencies, per distro. PROVISIONAL — derived from the -sys
# crates in Cargo.lock; after the first CI build, trim against
# `ldd target/release/magnetar-pencil`. The arch names are validated for real by
# arch-repo.yml's container install test.
#
# Migration from this project's own `pencil` package (1.2.0 and earlier). The
# version bound is what keeps it from touching Evolus Pencil, which is 3.x: an
# unversioned `replaces: pencil` would uninstall it on -Syu. `provides` keeps
# anything that still asks for `pencil` by name (an installer's package list,
# an optional dependency) resolving to this package wherever no other `pencil`
# is on offer; it is unversioned, so it never meets the versioned conflict.
overrides:
  deb:
    replaces:
      - pencil (<= 1.2.0)
    conflicts:
      - pencil (<= 1.2.0)
    provides:
      - pencil
    depends:
      - libxkbcommon0
  rpm:
    replaces:
      - pencil <= 1.2.0
    conflicts:
      - pencil <= 1.2.0
    provides:
      - pencil
    depends:
      - libxkbcommon
  archlinux:
    replaces:
      - pencil<=1.2.0
    conflicts:
      - pencil<=1.2.0
    provides:
      - pencil
    depends:
      - libxkbcommon

contents:
  # Everything `just rootdir=.release-kit/pkgroot install` staged: binaries,
  # desktop entries, icons, metainfo, services — applets and daemons
  # included. Modes are preserved from the staging tree.
  #
  # One tree per top-level directory, NOT a single tree at `/`: a tree whose
  # dst is `/` makes nfpm emit a tar entry with an empty name, and bsdtar
  # errors out on it ("Archive entry has empty or unreadable filename"), so
  # `repo-add` rejects the Arch package as "not a package file" and the pacman
  # repository never updates. The .deb and .rpm tolerate it, which is why this
  # only ever shows up on Arch.
  #
  # This justfile installs under the prefix only. A new top-level directory in
  # the install tree needs a new entry here.
  - src: .release-kit/pkgroot/usr
    dst: /usr
    type: tree
